version: 2

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - gocyclo

linters-settings:
  goimports:
    local-prefixes: github.com/yokitheyo/WarehouseControl

issues:
  exclude-rules:
    - path: "_test.go"
      linters:
        - errcheck
