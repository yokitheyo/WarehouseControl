<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Warehouse Control</title>
    <link rel="icon" type="image/svg+xml" href="https://tech.wildberries.ru/cabinet/favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
<!-- Контейнер для частиц -->
<div id="particles-js" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;"></div>

    <!-- Страница регистрации -->
    <div id="registerPage" class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">🏭</div>
                <h2>Регистрация</h2>
                <p>Создайте новый аккаунт</p>
            </div>
            <div id="registerAlert"></div>
            <form id="registerForm">
                <div class="form-group">
                    <label for="registerUsername">Имя пользователя</label>
                    <input type="text" id="registerUsername" placeholder="Введите имя пользователя" required
                        minlength="3">
                    <small>Минимум 3 символа</small>
                </div>
                <div class="form-group password-toggle">
                    <label for="registerPassword">Пароль</label>
                    <input type="password" id="registerPassword" placeholder="Введите пароль" required minlength="6">
                    <button type="button" class="password-toggle-btn"
                        onclick="togglePassword('registerPassword')">👁️</button>
                    <small>Минимум 6 символов</small>
                </div>
                <div class="form-group password-toggle">
                    <label for="registerPasswordConfirm">Подтвердите пароль</label>
                    <input type="password" id="registerPasswordConfirm" placeholder="Повторите пароль" required>
                    <button type="button" class="password-toggle-btn"
                        onclick="togglePassword('registerPasswordConfirm')">👁️</button>
                </div>
                <div class="form-group">
                    <label for="registerRole">Роль</label>
                    <select id="registerRole" required>
                        <option value="">Выберите роль</option>
                        <option value="admin">Администратор (полный доступ)</option>
                        <option value="manager">Менеджер (просмотр и редактирование)</option>
                        <option value="viewer">Просмотр (только чтение)</option>
                    </select>
                </div>
                <div class="role-description">
                    <strong>Описание ролей:</strong><br>
                    • <strong>Администратор:</strong> полный доступ ко всем операциям<br>
                    • <strong>Менеджер:</strong> может просматривать и редактировать товары<br>
                    • <strong>Просмотр:</strong> может только просматривать товары и историю
                </div>
                <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
            </form>
            <div class="auth-switch">
                Уже есть аккаунт? <a href="/login">Войти</a>
            </div>
        </div>
    </div>
    <!-- Инициализация particles.js -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            particlesJS("particles-js", {
                "particles": {
                    "number": { "value": 60, "density": { "enable": true, "value_area": 800 } },
                    "color": { "value": "#00ff88" },
                    "shape": { "type": "circle" },
                    "opacity": { "value": 0.3, "random": true },
                    "size": { "value": 3, "random": true },
                    "line_linked": { "enable": true, "distance": 150, "color": "#00ff88", "opacity": 0.2, "width": 1 },
                    "move": { "enable": true, "speed": 2, "out_mode": "out" }
                },
                "interactivity": {
                    "detect_on": "canvas",
                    "events": { "onhover": { "enable": true, "mode": "grab" } },
                    "modes": { "grab": { "distance": 140, "line_linked": { "opacity": 1 } } }
                },
                "retina_detect": true
            });
        });
    </script>
    <script src="/static/js/register.js"></script>
</body>

</html>
