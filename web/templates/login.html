<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Warehouse Control</title>
    <link rel="icon" type="image/svg+xml" href="https://tech.wildberries.ru/cabinet/favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<!-- Контейнер для частиц -->
<div id="particles-js" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;"></div>

    <!-- Страница авторизации -->
    <div id="loginPage" class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">🏭</div>
                <h2>Вход в систему</h2>
                <p>Warehouse Control System</p>
            </div>
            <div id="loginAlert" style="display: none;"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginUsername">Имя пользователя</label>
                    <input type="text" id="loginUsername" placeholder="Введите имя пользователя" required>
                </div>
                <div class="form-group password-toggle">
                    <label for="loginPassword">Пароль</label>
                    <input type="password" id="loginPassword" placeholder="Введите пароль" required>
                    <button type="button" class="password-toggle-btn"
                        onclick="togglePassword('loginPassword')">👁️</button>
                </div>
                <button type="submit" class="btn btn-primary">Войти</button>
            </form>
            <div class="auth-switch">
                Нет аккаунта? <a href="/register">Зарегистрироваться</a>
            </div>
            <div class="role-description" style="margin-top: 20px;">
                <strong>Тестовые учетные записи:</strong><br>
                • admin / password123 (полный доступ)<br>
                • manager / password123 (просмотр и редактирование)<br>
                • viewer / password123 (только просмотр)
            </div>
        </div>
    </div>
    <!-- Инициализация particles.js -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            particlesJS("particles-js", {
                "particles": {
                    "number": { "value": 60, "density": { "enable": true, "value_area": 800 } },
                    "color": { "value": "#00ff88" },
                    "shape": { "type": "circle" },
                    "opacity": { "value": 0.3, "random": true },
                    "size": { "value": 3, "random": true },
                    "line_linked": { "enable": true, "distance": 150, "color": "#00ff88", "opacity": 0.2, "width": 1 },
                    "move": { "enable": true, "speed": 2, "out_mode": "out" }
                },
                "interactivity": {
                    "detect_on": "canvas",
                    "events": { "onhover": { "enable": true, "mode": "grab" } },
                    "modes": { "grab": { "distance": 140, "line_linked": { "opacity": 1 } } }
                },
                "retina_detect": true
            });
        });
    </script>
    <script src="/static/js/login.js"></script>
</body>

</html>
